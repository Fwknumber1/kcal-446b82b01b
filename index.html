<title>Calories</title>
<style>
:root{--bg:#0D0E0B;--card:#181A16;--card2:#22251F;--well:#0F110D;--line:#262923;--edge:#2E322A;--fg:#F3F2EC;--mut:#A9AC9F;--acc:#C8F05A;--org:#FF9F62;--blu:#7DB4FF;--yel:#F5C451;--wat:#5CCFE6;color-scheme:dark}
*{box-sizing:border-box}

.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.35 'Geist',ui-sans-serif,-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--well);border:1px solid var(--edge);border-radius:12px;height:46px;padding:0 12px;width:100%;min-width:0}
input::placeholder{color:#7C8074}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
.disp{font-family:'Bricolage Grotesque','Geist',system-ui,sans-serif;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:12px}.red{color:var(--org);font-size:13px;font-weight:600}
.acc{color:var(--acc)}

#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.page{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
nav{flex:0 0 auto;position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:#121410;border-top:1px solid #22251F;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px))}
nav button{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#8A8E80}
nav button[aria-current=page]{color:var(--acc);font-weight:600}
nav .fab{justify-self:center;width:58px;height:58px;min-height:0;margin-top:-18px;border-radius:29px;background:var(--acc);color:#0D0E0B}

.top{display:flex;align-items:center;gap:12px}
.top h1{flex:1;font-size:30px;font-weight:700}
.big{font-size:38px;font-weight:700;line-height:1.05}
.eyebrow{font-size:13px;font-weight:500;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.icb{width:44px;height:44px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border-radius:22px}
.icb.circ{background:#1C1E19}
.icb:disabled{opacity:.35;cursor:default}
.icb.sm{width:auto;min-width:44px;padding:0 6px;border-radius:12px;color:var(--mut)}
.card{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{height:48px;white-space:nowrap;border-radius:14px;background:var(--acc);color:#0D0E0B;font-weight:700;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}

.btn.wide{width:100%;height:56px;font-size:17px;border-radius:18px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;background:var(--card);border-radius:16px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{height:40px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--acc);color:#0D0E0B}

.hero{display:flex;align-items:center;gap:20px}

.trk{height:6px;border-radius:3px;background:#2A2D26}.trk i{display:block;height:6px;border-radius:3px}
.wat{display:flex;align-items:center;gap:8px;border-top:1px solid #2A2D26;padding-top:14px}
.pill{height:44px;padding:0 14px;border-radius:22px;background:#1C2A2E;color:var(--wat);font-size:13px;font-weight:600;white-space:nowrap}
.link{display:flex;flex-direction:row;font-size:15px;color:var(--fg);cursor:pointer;align-items:center;gap:14px;min-height:64px;padding:12px 16px;border-radius:20px;background:var(--card);width:100%;text-align:left}

.ent .en span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-height:58px}.frow:last-child{border-bottom:0}
.fmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:8px 0;min-height:44px;justify-content:center}
.fmain .fn,.fmain .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn{font-weight:500}

.stack{display:flex;flex-direction:column;gap:14px}
.sw{width:52px;height:32px;flex:0 0 auto;padding:3px;border-radius:16px;background:#3A3E35;display:flex}
.sw[aria-checked=true]{background:var(--acc);justify-content:flex-end}
.sw i{width:26px;height:26px;border-radius:13px;background:#F3F2EC}
details{background:var(--card);border-radius:20px;padding:0 18px}
details[open]{padding-bottom:16px}
summary{min-height:52px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details ol{display:flex;flex-direction:column;gap:8px;padding-left:20px;list-style:decimal;color:#C9CBC0;font-size:14px;margin-bottom:14px}
details p{color:var(--mut);font-size:13px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 0;text-align:right;border-bottom:1px solid #1F221C;font-variant-numeric:tabular-nums}th{text-align:left;font-weight:500}

.scan{position:fixed;inset:0;z-index:20;background:#050604;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.scan header h2{font-size:17px;font-weight:600;text-shadow:0 1px 6px #000}
.scan .frame{position:absolute;left:50%;top:40%;width:min(78vw,300px);height:150px;margin:-75px 0 0 calc(min(78vw,300px) / -2);border:3px solid var(--acc);border-radius:22px;box-shadow:0 0 0 100vmax rgba(5,6,4,.55)}
.scan .sheet{position:relative;margin-top:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.scan form{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);max-width:88vw;padding:12px 18px;border-radius:14px;background:#F3F2EC;color:#0D0E0B;font-weight:600;font-size:14px;z-index:40;pointer-events:none}
</style>

<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div id="toast" role="status" hidden></div>
<input id="mealphoto" class="vh" type="file" accept="image/*" aria-label="Meal photo">
<script src="zxing-wasm.js" defer></script>
<script defer>
/* ---------- data ---------- */
const KEY = 'calories.v1';
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
const DEF = () => ({ goal: { kcal: 2200, p: 140, c: 240, f: 70, w: 2000, cup: 250 }, burn: {}, water: {}, countBurn: true, burnPct: 100, entries: {}, foods: [] });
const fill = s => ({ ...DEF(), ...s, goal: { ...DEF().goal, ...s.goal } });   // older saves lack newer keys (water)
let db = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') return fill(s); } catch (e) {}
  return DEF();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Could not save. Is storage full or blocked?'); } }

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = x => Math.round(x || 0).toLocaleString('en-US');
const n1 = x => String(Math.round((x || 0) * 10) / 10);
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return Number.isFinite(x) && x >= 0 ? x : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const autoMeal = () => { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; };
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

const P = {
  home: '<path d="M4 11l8-6.5 8 6.5V20h-5.5v-5h-5v5H4z"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13.5 8v8M17 8v8"/>',
  flame: '<path d="M12 21c4 0 7-2.8 7-6.8 0-3.6-2.6-5.7-4-8.2-.6 2-1.6 3-3 3.5.3-2.4-.6-5-3-6.5 0 3.5-4 5.8-4 11.2C5 18.2 8 21 12 21z"/>',
  chart: '<path d="M4 19h16M6 16l4-5 3.5 3L19 7"/>',
  plus: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  minus: '<path d="M6 12h12"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  fwd: '<path d="M9 6l6 6-6 6"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  camera: '<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/>',
  watch: '<rect x="6" y="6" width="12" height="12" rx="3.5"/><path d="M9 6l.6-3h4.8l.6 3M9 18l.6 3h4.8l.6-3M12 9.5V12l1.5 1.2"/>',
};
const ico = (n, s = 22, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- state ---------- */
const ui = { view: 'today', date: ymd(new Date()), today: ymd(new Date()), meal: autoMeal(), q: '', food: null, grams: 100, custom: null, back: 'today', confirm: null, scanMsg: '', busy: false, snap: null };

function day(date) {
  const es = db.entries[date] || [], t = { k: 0, p: 0, c: 0, f: 0 };
  es.forEach(e => { t.k += e.k; t.p += e.p; t.c += e.c; t.f += e.f; });
  return { es, t };
}
const credit = date => db.countBurn ? Math.round((db.burn[date] || 0) * db.burnPct / 100) : 0;
const calc = (f, g) => { const x = g / 100; return { k: f.k * x, p: f.p * x, c: f.c * x, f: f.f * x }; };

function addEntry(e) { (db.entries[ui.date] ||= []).push({ id: uid(), meal: ui.meal, ...e }); save(); }
function upsertFood(f) {
  const { s, a, alt, r, pop, ...clean } = f;   // search/ranking helpers from the bundled libraries, not worth storing
  const i = db.foods.findIndex(x => clean.code ? x.code === clean.code : (!x.code && x.name === clean.name && x.brand === clean.brand));
  const rec = { ...clean, id: i >= 0 ? db.foods[i].id : uid(), used: Date.now() };
  if (i >= 0) db.foods[i] = rec; else db.foods.push(rec);
  return rec;
}
function logFood(f, g) {
  const r = upsertFood(f), v = calc(r, g);
  addEntry({ name: r.name, q: r.sl && g === r.sg ? `${r.sl} · ${n1(g)} g` : `${n1(g)} g`, ...v });
}

/* ---------- Egyptian library (bundled, works offline) ---------- */
// egypt-foods.json: everyday dishes. egypt-products.json: packaged products from Open Food Facts, rows of
// [code, name, brand, kcal/100g, protein, carbs, fat, serving_g, arabic_name].
let EGF = [], EGP = [], EGPcode = new Map(), USF = [];
// words only (leading space each), Arabic letter variants folded, article "ال" dropped so "الكشري" finds "كشري"
const norm = s => (' ' + String(s || '').toLowerCase()
  .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .replace(/[^\p{L}\p{N}]+/gu, ' ')).replace(/ ال(?=\S\S)/g, ' ');
// egypt-foods.json: src 'nni' = lab values from Egypt's National Nutrition Institute tables (2006), 'est' = recipe estimates,
// 'cc0' = open community dataset. r ranks search results: lab values first.
const RANK = { nni: 0, est: 1, usda: 2, cc0: 3 };
const TAG = { nni: 'NNI lab', est: 'estimate', cc0: 'community', usda: 'USDA' };
fetch('egypt-foods.json').then(r => r.json()).then(a => {
  EGF = a.map(x => ({ ...x, brand: '', code: '', r: RANK[x.src] ?? 1, a: norm(x.ar), s: norm([x.name, x.ar, x.alt].join(' ')) }));
}).catch(() => {});
fetch('egypt-products.json').then(r => r.json()).then(a => {
  EGP = a.map(([code, name, brand, k, p, c, f, sg, ar]) => ({ code, name, brand, k, p, c, f, sg, ar, a: norm(ar), s: norm([name, brand, ar].join(' ')) }));
  EGP.forEach(x => EGPcode.set(x.code, x));
}).catch(() => {});
// foods-common.json: USDA FNDDS "foods as eaten" (public domain), rows of [name, kcal/100g, protein, carbs, fat, serving_g, serving_label]
fetch('foods-common.json').then(r => r.json()).then(a => {
  USF = a.map(([name, k, p, c, f, sg, sl]) => ({ name, brand: '', code: '', k, p, c, f, sg, sl, src: 'usda', s: norm(name) }));
}).catch(() => {});
function matchLib(list, q, max) {
  const t = norm(q).split(' ').filter(Boolean); if (!t.length) return [];
  const hit = list.filter(x => t.every(w => x.s.includes(' ' + w)));   // every typed word must start a word in the name
  // English or Arabic name starting with the first word, then Egyptian staples, then lab values first, then shorter names
  const w0 = ' ' + t[0], st = x => x.s.startsWith(w0) || (x.a || '').startsWith(w0);
  hit.sort((a, b) => (st(b) - st(a)) || (b.pop | 0) - (a.pop | 0) || (a.r ?? 1) - (b.r ?? 1) || a.name.length - b.name.length);
  return hit.slice(0, max);
}

/* ---------- Open Food Facts ---------- */
function mapProduct(p) {
  const n = p.nutriments || {};
  let k = n['energy-kcal_100g'];
  if (k == null && n['energy_100g'] != null) k = n['energy_100g'] / 4.184; // energy_100g is kJ
  if (k == null) return null;
  const brand = (Array.isArray(p.brands) ? p.brands[0] : String(p.brands || '').split(',')[0]) || '';
  const ar = (p.product_name_ar || '').trim(), name = (p.product_name || p.product_name_en || '').trim() || ar || 'Unnamed product';
  return { code: p.code || '', name, brand: brand.trim(), ar: ar !== name ? ar : '',
    k, p: +n['proteins_100g'] || 0, c: +n['carbohydrates_100g'] || 0, f: +n['fat_100g'] || 0, sg: +p.serving_quantity || 0 };
}
async function lookup(code) {
  const local = db.foods.find(f => f.code === code) || EGPcode.get(code);
  if (local) return local;
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_en,product_name_ar,brands,nutriments,serving_quantity`, { signal: AbortSignal.timeout(12000) });
  if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json();
  if (j.status !== 1 || !j.product) return null;
  // known product without calorie data: keep its name so the add-by-hand form starts filled in
  return mapProduct({ ...j.product, code }) || { partial: true, name: (j.product.product_name || j.product.product_name_en || j.product.product_name_ar || '').trim() };
}
/* ---------- views ---------- */
const dateTitle = d => d === ui.today ? 'Today' : d === addDays(ui.today, -1) ? 'Yesterday' : parseYmd(d).toLocaleDateString('en-US', { weekday: 'long' });
const dateSub = d => parseYmd(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const mealSeg = () => `<div class="seg" role="group" aria-label="Meal">${MEALS.map(m => `<button data-act="meal" data-m="${m}" aria-pressed="${m === ui.meal}">${m}</button>`).join('')}</div>`;

function vToday() {
  const { es, t } = day(ui.date), g = db.goal, burn = db.burn[ui.date] || 0, cr = credit(ui.date), wat = db.water[ui.date] || 0;
  const budget = g.kcal + cr, left = Math.round(budget - t.k), over = left < 0, C = 326.7;
  const frac = Math.max(0, Math.min(1, budget > 0 ? t.k / budget : 0)), tone = over ? '#FF8F4A' : 'var(--acc)';
  const bar = (l, v, goal, col) => `<div class="mac"><span class="mut">${l}</span><b class="num" style="font-size:14px;white-space:nowrap">${n0(v)}<span class="mut" style="font-weight:400"> / ${n0(goal)} g</span></b><div class="trk"><i style="width:${goal ? Math.min(100, v / goal * 100) : 0}%;background:${col}"></i></div></div>`;
  const meals = MEALS.map(m => {
    const items = es.filter(e => e.meal === m), sum = items.reduce((a, e) => a + e.k, 0);

function logBody() {
  const q = ui.q.trim(), nq = q.toLowerCase();
  const sub = f => [f.ar && `<bdi>${esc(f.ar)}</bdi>`, f.brand && esc(f.brand), `${n0(f.k)} kcal / 100 g`, TAG[f.src]].filter(Boolean).join(' · ');
  const row = (f, src, i) => `<li class="frow"><button class="fmain" data-act="open" data-src="${src}" data-i="${i}"><span class="fn">${esc(f.name)}</span><span class="mut sm">${sub(f)}</span></button>
    <button class="icb acc" data-act="quick" data-src="${src}" data-i="${i}" aria-label="Add ${esc(f.name)}">${ico('plus')}</button></li>`;
  const list = (arr, src, idx) => arr.length ? `<ul class="list">${arr.map((f, n) => row(f, src, idx ? idx[n] : n)).join('')}</ul>` : '';
  const sec = (title, inner) => inner ? `<section><h2 class="eyebrow" style="margin:6px 0">${title}</h2>${inner}</section>` : '';
  const mine = db.foods.map((f, i) => ({ f, i })).sort((a, b) => b.f.used - a.f.used)
    .filter(({ f }) => !q || (f.name + ' ' + f.brand + ' ' + (f.ar || '')).toLowerCase().includes(nq)).slice(0, q ? 30 : 6);
  const mineList = list(mine.map(m => m.f), 'l', mine.map(m => m.i));
  if (!q) {   // before searching: Egyptian staples only; search reaches the whole library
    const pops = EGF.map((f, i) => ({ f, i })).filter(o => o.f.pop);
    return sec('Recent', mineList) + sec('Egyptian staples', list(pops.map(o => o.f), 'f', pops.map(o => o.i)));
  }
  const found = sec('Your foods', mineList) + sec('Egyptian foods', list(matchLib(EGF, q, 10), 'e')) + sec('Egyptian products', list(matchLib(EGP, q, 15), 'p')) + sec('Common foods', list(matchLib(USF, q, 20), 'u'));
  return (found || `<p class="mut" style="padding:6px 2px">Nothing found for “${esc(q)}”. Scan its barcode, or add it by hand.</p>`) +
    `<button class="btn alt" style="width:100%" data-act="custom" data-name="${esc(q)}">Add “${esc(q)}” by hand</button>`;
}

function vProgress() {
  const days = [...Array(7)].map((_, i) => addDays(ui.today, i - 6)), vals = days.map(d => Math.round(day(d).t.k));

    <text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="11" fill="#A9AC9F">${parseYmd(days[i]).toLocaleDateString('en-US', { weekday: 'short' })}</text>`; }).join('');
  const logged = days.map(d => day(d).t).filter(t => t.k > 0), avg = k => logged.length ? n0(logged.reduce((a, t) => a + t[k], 0) / logged.length) : '–';

    <button class="btn">Save goals</button></form>
  <details><summary>About the food data</summary>
    <p>Packaged products come from Open Food Facts, a free database made by volunteers (ODbL licence). About 1,500 Egyptian products are built in, so scanning them works offline.</p>
    <p>Common foods come from USDA FoodData Central (public domain): about 5,000 foods as people eat them, with real portion sizes.</p>

    ${aiKey() ? `<p>Key saved on this phone: <span class="num">sk-ant-…${esc(aiKey().slice(-4))}</span></p><button class="btn alt" style="width:100%" data-act="delkey">Remove key</button>`
      : `<ol><li>Open <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Claude Console → API keys</a> and create a key.</li><li>Paste it here and tap Save.</li></ol>
      <form data-submit="savekey" style="display:flex;gap:10px"><input id="aik" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" aria-label="Anthropic API key"><button class="btn">Save</button></form>`}
    <p style="margin:12px 0 0">The key stays on this phone. It is not in your backup or on GitHub.</p></details>
  <details><summary>Back up your log</summary><p>Your log lives only on this phone. Copy a backup now and then, and paste it back if you ever lose the app.</p>
    <div class="grid2"><button class="btn alt" data-act="backup">Copy backup</button><button class="btn alt" data-act="restore">Restore</button></div></details></div>`;
}

const VIEWS = { today: vToday, log: vLog, food: vFood, snap: vSnap, custom: vCustom, scan: vScan, activity: vActivity, progress: vProgress };
const NAV = [['today', 'Today', 'home'], ['log', 'Log', 'list'], ['scan', 'Scan barcode', 'scan'], ['activity', 'Activity', 'flame'], ['progress', 'Progress', 'chart']];
const NAV_OF = { today: 'today', log: 'log', food: 'log', snap: 'log', custom: 'log', activity: 'activity', progress: 'progress' };

function render() {
  const main = $('#view'), top = main.scrollTop;
  main.innerHTML = VIEWS[ui.view]();
  const scanning = ui.view === 'scan';
  $('#nav').hidden = scanning;
  $('#nav').innerHTML = NAV.map(([id, label, ic]) => id === 'scan'
    ? `<button class="fab" data-act="go" data-to="scan" aria-label="Scan barcode">${ico('scan', 26, 2)}</button>`
    : `<button data-act="go" data-to="${id}" ${NAV_OF[ui.view] === id ? 'aria-current="page"' : ''}>${ico(ic)}${label}</button>`).join('');
  if (ui.view === 'food') updateFood();
  if (ui.view === 'scan') startScan();
  main.scrollTop = top;
}
function go(to) {
  if (ui.view === 'scan') stopScan();
  if (to === 'scan') { ui.back = ['today', 'log', 'activity', 'progress'].includes(ui.view) ? ui.view : 'log'; ui.scanMsg = ''; ui.busy = false; }
  if (to === 'log' && ui.view !== 'log') ui.q = '';
  ui.view = to; ui.confirm = null; render();
  if (to !== 'today') $('#view').scrollTop = 0;
}
function openFood(f, back) { ui.food = f; ui.grams = f.sg || 100; ui.back = back; ui.view = 'food'; render(); $('#view').scrollTop = 0; }

/* ---------- scanner ---------- */
// zxing-wasm (ZXing C++): on simulated soft phone frames it read 20/20 where the JS port read 4/20, and it never returned a
// wrong number (the JS port did, often). We ask for 1080p and decode only the strip around the on-screen frame.
let cam = null, zxPrepared = false;
const ZX_OPTS = { formats: ['EAN13', 'EAN8', 'UPCA', 'UPCE'], tryHarder: true, maxNumberOfSymbols: 1 };
async function readPixels(imageData) {
  if (!zxPrepared) {   // serve the .wasm from this site so scanning works offline
    ZXingWASM.prepareZXingModule({ overrides: { locateFile: (p, pre) => p.endsWith('.wasm') ? new URL('zxing_reader.wasm', location.href).href : pre + p }, fireImmediately: true });
    zxPrepared = true;
  }
  const r = await ZXingWASM.readBarcodes(imageData, ZX_OPTS);
  return r.length ? r[0].text : null;
}
function setScanMsg(m, again) { ui.scanMsg = m; const e = $('#scanmsg'); if (e) e.textContent = m; const b = $('#rescan'); if (b) b.hidden = !again; }
const setDiag = t => { const e = $('#diag'); if (e) e.textContent = t; };
async function startScan() {
  stopScan();
  if (!navigator.mediaDevices?.getUserMedia || !window.ZXingWASM) return setScanMsg('The live camera is not available here. Take a photo or type the number.');
  const s = cam = { tries: 0, stream: null, timer: 0 };
  try {
    s.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    if (cam === s) setScanMsg(e && e.name === 'NotAllowedError' ? 'Camera access is off. Allow it in iPhone Settings, or take a photo instead.' : 'Could not start the camera. Take a photo or type the number instead.', true);
    return;
  }
  if (cam !== s) return s.stream.getTracks().forEach(t => t.stop());   // left the scanner while the camera was starting
  const v = $('#vid'); v.srcObject = s.stream; v.play().catch(() => {});
  const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (cam !== s) return;
    const vw = v.videoWidth, vh = v.videoHeight, f = $('.scan .frame');
    if (vw && f) {
      // the video is object-fit: cover, so map the frame's screen position into video pixels; full width, padded height.
      // Sizes are re-read every frame because iPhone streams can change size (orientation) after they start.
      const vr = v.getBoundingClientRect(), fr = f.getBoundingClientRect(), k = Math.max(vr.width / vw, vr.height / vh);
      const oy = (vh * k - vr.height) / 2, pad = fr.height * 0.6;
      const y0 = Math.max(0, (fr.top - vr.top - pad + oy) / k), y1 = Math.min(vh, (fr.bottom - vr.top + pad + oy) / k), h = Math.round(y1 - y0);
      if (h > 20) {
        if (c.width !== vw || c.height !== h) { c.width = vw; c.height = h; }
        x.drawImage(v, 0, y0, vw, h, 0, 0, vw, h);
        const code = await readPixels(x.getImageData(0, 0, vw, h)).catch(() => null); s.tries++;
        if (cam !== s) return;
        if (code) return onCode(code);
        if (s.tries % 10 === 1) setDiag(`Camera ${vw}×${vh} · ${s.tries} tries`);
      }
    }
    s.timer = setTimeout(tick, 40);
  };
  tick();
}
function stopScan() { if (!cam) return; clearTimeout(cam.timer); cam.stream?.getTracks().forEach(t => t.stop()); cam = null; }
// The phone's own camera app focuses close and shoots at full resolution, so a still photo is the reliable fallback.
async function readPhoto(file) {
  if (!file || !window.ZXingWASM) return;
  stopScan(); ui.busy = false;
  setScanMsg('Reading the photo…'); setDiag('');
  const url = URL.createObjectURL(file), img = new Image();
  try {
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    for (const max of [1600, 2400, 1000]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      const code = await readPixels(x.getImageData(0, 0, c.width, c.height));
      if (code) return onCode(code);
    }
    setScanMsg('No barcode found in that photo. Try again a little closer, with the barcode flat and well lit.', true);
  } catch (e) { setScanMsg('Could not read that photo. Try again or type the number.', true); }
  finally { URL.revokeObjectURL(url); }
}
async function onCode(code) {
  if (ui.busy) return; ui.busy = true; stopScan();
  if (/^\d{12}$/.test(code)) code = '0' + code;
  setScanMsg(`Found ${code}. Looking it up…`);
  try {
    const f = await lookup(code);
    if (ui.view !== 'scan') return;
    if (f && !f.partial) return openFood(f, ui.back);
    ui.custom = f ? { code, name: f.name, note: 'Open Food Facts knows this product but has no calories for it. Enter them once from the label and it is saved for next time.' }
      : { code, name: '', note: 'Not in Open Food Facts yet. Enter it once from the label and it is saved for next time.' };
    ui.view = 'custom'; render();
  } catch (e) { ui.busy = false; setScanMsg('Could not reach Open Food Facts. Check your connection and try again.', true); }
}

/* ---------- meal photo: Claude names each food and guesses grams ---------- */
const AIKEY = 'calories.aikey';   // kept apart from the log, so a backup never carries the key
const aiKey = () => { try { return localStorage.getItem(AIKEY) || ''; } catch (e) { return ''; } };
const SNAP_SYSTEM = `You look at a photo of a meal for a personal calorie tracker in Egypt and estimate what is in it.

List each separate food or drink you can see (bread, rice, a stew, a salad, a drink). Keep things eaten as one dish together, like koshari or a sandwich.

For each item give:
- name: a short, common English name, like "Koshari", "Aish baladi", "White rice" or "Grilled chicken breast".
- ar: its usual Egyptian Arabic name, or "" if there is none.
- grams: your best estimate of the edible amount in the photo. Use the plate, cutlery, hands, bread and packaging to judge size. When unsure, pick the middle of the likely range.
- kcal, protein, carbs, fat: per 100 g of the food as served, counting the cooking oil, butter and sauce on it.

If a nutrition label or package is visible, use its numbers. If there is no food or drink in the photo, return no items.

note: one short sentence naming what was hardest to judge (hidden oil, a filling, the portion), or "" if nothing was.`;
const NUM = { type: 'number' };
const SNAP_SCHEMA = { type: 'object', additionalProperties: false, required: ['items', 'note'], properties: { note: { type: 'string' },
  items: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['name', 'ar', 'grams', 'kcal', 'protein', 'carbs', 'fat'],
    properties: { name: { type: 'string' }, ar: { type: 'string' }, grams: NUM, kcal: NUM, protein: NUM, carbs: NUM, fat: NUM } } } } };
let Anthropic = null;
// ~1,000 image tokens at 1024 px, plenty to tell foods apart
async function photoJpeg(file, max = 1024) {
  const url = URL.createObjectURL(file), img = new Image();
  try {
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}
// Egyptian lab values beat a guess when Claude names a dish the NNI tables have
const fromLib = it => {
  const n = norm(it.name), a = norm(it.ar), hit = EGF.find(x => x.src === 'nni' && (norm(x.name) === n || (it.ar && x.a === a)));
  return hit ? { name: hit.name, ar: hit.ar || it.ar, g: it.grams, k: hit.k, p: hit.p, c: hit.c, f: hit.f, tag: TAG.nni }
    : { name: it.name, ar: it.ar, g: it.grams, k: it.kcal, p: it.protein, c: it.carbs, f: it.fat, tag: 'AI estimate' };
};
function aiError(e) {
  const A = Anthropic;
  if (!A || e instanceof A.APIConnectionError) return 'Could not reach Claude. Check your internet connection and try again.';
  if (e instanceof A.AuthenticationError) return 'Claude did not accept your API key. Check it in Progress → Meal photos.';
  if (e instanceof A.RateLimitError) return 'Too many requests right now. Wait a minute and try again.';
  if (e instanceof A.APIError) return `Claude error ${e.status}: ${e.error?.error?.message || e.message}`;
  return e.message || 'Could not read Claude’s answer. Try again.';
}
async function readMeal(file) {
  if (!file) return;
  if (!aiKey()) { toast('Add your API key first'); return go('progress'); }
  if (ui.view === 'scan') stopScan();
  if (ui.view !== 'snap') ui.back = ui.view === 'scan' ? 'log' : ui.view;
  const run = ui.snap = { img: '', items: null, note: '', err: '' }, show = () => { if (ui.snap === run && ui.view === 'snap') render(); };
  ui.view = 'snap'; render(); $('#view').scrollTop = 0;
  try { run.img = await photoJpeg(file); } catch (e) { run.err = 'Could not open that photo. Try another one.'; return show(); }
  show();
  try {
    Anthropic ||= (await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm')).default;
    const client = new Anthropic({ apiKey: aiKey(), dangerouslyAllowBrowser: true });   // your own key, on your own phone
    const r = await client.messages.create({
      model: 'claude-opus-5-5', max_tokens: 8000, system: SNAP_SYSTEM,
      output_config: { format: { type: 'json_schema', schema: SNAP_SCHEMA } },
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: run.img.split(',')[1] } },
        { type: 'text', text: `Estimate this ${ui.meal.toLowerCase()}.` }] }],
    });
    if (r.stop_reason === 'refusal') throw new Error('Claude would not estimate this photo. Try another one.');
    if (r.stop_reason === 'max_tokens') throw new Error('Claude’s answer was cut off. Try again.');
    const j = JSON.parse(r.content.find(b => b.type === 'text')?.text || '{}');
    run.items = (j.items || []).map(fromLib); run.note = j.note || '';
  } catch (e) { run.err = aiError(e); }
  show();
}
const snapTot = () => (ui.snap?.items || []).reduce((t, x) => { const v = calc(x, x.g); t.k += v.k; t.p += v.p; t.c += v.c; t.f += v.f; return t; }, { k: 0, p: 0, c: 0, f: 0 });
function updSnap() {
  const its = ui.snap?.items; if (!its) return;
  its.forEach((x, i) => { const e = $('#sk' + i); if (e) e.textContent = n0(calc(x, x.g).k); });
  const t = snapTot(), set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
  set('#snapk', n0(t.k)); set('#snapm', `P ${n0(t.p)} g · C ${n0(t.c)} g · F ${n0(t.f)} g`); set('#snapadd', `Add to ${ui.meal} · ${n0(t.k)} kcal`);
}

/* ---------- actions ---------- */
const food = (src, i) => ({ l: () => db.foods[i], e: () => matchLib(EGF, ui.q, 10)[i], p: () => matchLib(EGP, ui.q, 15)[i], u: () => matchLib(USF, ui.q, 20)[i], f: () => EGF[i] })[src]();
const acts = {
  go: d => go(d.to),
  day: d => { const n = addDays(ui.date, +d.d); if (n <= ui.today) { ui.date = n; ui.confirm = null; render(); } },
  add: d => { ui.meal = d.m; go('log'); },
  meal: d => { ui.meal = d.m; document.querySelectorAll('[data-act=meal]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === d.m)); if (ui.view === 'food') updateFood(); if (ui.view === 'snap') updSnap(); },
  open: d => openFood(food(d.src, +d.i), 'log'),
  quick: d => { const f = food(d.src, +d.i); logFood(f, f.sg || 100); toast(`Added to ${ui.meal}`); go('today'); },
  grams: d => { $('#grams').value = n1(+d.g); updateFood(); },
  addfood: () => { if (ui.grams <= 0) return toast('Enter an amount'); logFood(ui.food, ui.grams); toast(`Added to ${ui.meal}`); go('today'); },
  del: d => {
    if (ui.confirm === d.id) { db.entries[ui.date] = (db.entries[ui.date] || []).filter(e => e.id !== d.id); ui.confirm = null; save(); return render(); }
    ui.confirm = d.id; render(); setTimeout(() => { if (ui.confirm === d.id) { ui.confirm = null; if (ui.view === 'today') render(); } }, 3000);
  },
  snapdel: d => { ui.snap.items.splice(+d.i, 1); render(); },
  snapadd: () => {
    const its = ui.snap.items.filter(x => x.g > 0); if (!its.length) return toast('Nothing to add');
    its.forEach(x => addEntry({ name: x.name, q: `${n1(x.g)} g · photo estimate`, ...calc(x, x.g) }));
    ui.snap = null; toast(`Added to ${ui.meal}`); go('today');
  },
  delkey: () => { try { localStorage.removeItem(AIKEY); } catch (e) {} render(); toast('Key removed'); },
  clearq: () => { ui.q = ''; render(); $('#q').focus(); },
  custom: d => { ui.custom = { name: d.name || '', code: '', note: '' }; ui.back = 'log'; ui.view = 'custom'; render(); },
  rescan: () => { ui.busy = false; setScanMsg('Hold the phone 15–20 cm away so it can focus.'); startScan(); },
  toggleburn: () => { db.countBurn = !db.countBurn; save(); render(); },
  pct: d => { db.burnPct = +d.n; save(); render(); },
  water: d => { db.water[ui.date] = Math.max(0, (db.water[ui.date] || 0) + +d.ml); save(); render(); },
  pasteburn: async () => {
    try {
      const m = (await navigator.clipboard.readText()).match(/\d+(?:[.,]\d+)?/);
      if (!m) return toast('No number on the clipboard. Run the Shortcut first.');
      db.burn[ui.date] = Math.round(num(m[0])); save(); render(); toast('Watch calories saved');
    } catch (e) { toast('Paste was blocked. Type the number instead.'); }
  },
  backup: async () => { try { await navigator.clipboard.writeText(JSON.stringify(db)); toast('Backup copied. Paste it into Notes.'); } catch (e) { toast('Could not copy the backup.'); } },
  restore: async () => {
    try {
      const s = JSON.parse(await navigator.clipboard.readText());
      if (!s || typeof s.entries !== 'object' || !s.goal) throw 0;
      db = fill(s); save(); render(); toast('Backup restored');
    } catch (e) { toast('The clipboard does not hold a backup.'); }
  },
};
const forms = {
  search: () => $('#q').blur(),
  qadd: () => {
    const k = num($('#qk').value); if (!k) return toast('Enter the calories');
    addEntry({ name: $('#qn').value.trim() || 'Quick add', q: '', k, p: num($('#qp').value), c: num($('#qc').value), f: num($('#qf').value) });
    toast(`Added to ${ui.meal}`); go('today');
  },
  typed: () => { const c = $('#bc').value.replace(/\D/g, ''); if (c.length < 6) return toast('Enter the full barcode number'); ui.busy = false; onCode(c); },
  savefood: () => {
    const name = $('#cn').value.trim(), k = num($('#ck').value); if (!name) return toast('Enter a name');
    const f = upsertFood({ code: $('#cb').value.replace(/\D/g, ''), name, brand: '', k, p: num($('#cp').value), c: num($('#cc').value), f: num($('#cf').value), sg: num($('#cs').value) });
    save(); openFood(f, 'log');
  },
  savekey: () => {
    const k = $('#aik').value.trim(); if (!/^sk-ant-\S{20,}$/.test(k)) return toast('That is not an Anthropic key. It starts with sk-ant-');
    try { localStorage.setItem(AIKEY, k); } catch (e) { return toast('Could not save the key on this phone.'); }
    render(); toast('Key saved. Snap your meal on the Log screen.');
  },
  saveburn: () => { db.burn[ui.date] = Math.round(num($('#burn').value)); save(); render(); toast('Saved'); },
  savegoals: () => {
    db.goal = { kcal: Math.round(num($('#gk').value)) || db.goal.kcal, p: Math.round(num($('#gp').value)), c: Math.round(num($('#gc').value)), f: Math.round(num($('#gf').value)), w: Math.round(num($('#gw').value)) || db.goal.w, cup: Math.round(num($('#gcup').value)) || db.goal.cup };
    save(); render(); toast('Goals saved');
  },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) acts[b.dataset.act]?.(b.dataset, b); });
document.addEventListener('submit', e => { e.preventDefault(); forms[e.target.dataset.submit]?.(); });
document.addEventListener('input', e => {
  if (e.target.id === 'grams') updateFood();
  if (e.target.classList.contains('sg')) { ui.snap.items[+e.target.dataset.i].g = num(e.target.value); updSnap(); }
  if (e.target.id === 'q') { ui.q = e.target.value; $('#results').innerHTML = logBody(); $('#clr').hidden = !ui.q.trim(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'photo') { readPhoto(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'mealphoto') { readMeal(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = ymd(new Date());
  if (t !== ui.today) { if (ui.date === ui.today) ui.date = t; ui.today = t; if (ui.view !== 'scan') render(); }
});
window.addEventListener('DOMContentLoaded', () => { render(); navigator.storage?.persist?.(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
